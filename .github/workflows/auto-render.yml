name: auto-render

# Claude (งานตามเวลา) push projects/d-*/shots.json → ไฟล์นี้สร้างภาพ AI + เสียง + เรนเดอร์ + ปก + แคปชัน
# แล้วแปะเป็น GitHub Release ชื่อ <slug> → เครื่องผู้ใช้ดึงลงโฟลเดอร์ด้วย auto/windows/sync-clips.ps1
on:
  push:
    branches: [main]
    paths: ['projects/d-*/shots.json']
  workflow_dispatch:
    inputs:
      slug:
        description: 'slug ที่จะเรนเดอร์ใหม่ (เช่น d-20261109-am)'
        required: true

permissions:
  contents: write

concurrency:
  group: auto-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      IMAGE_MAX_COST: '0.8'
      HT_PYTHON: python3
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: หา slug ที่ต้องทำ
        id: slugs
        run: |
          if [ -n "${{ github.event.inputs.slug }}" ]; then
            S="${{ github.event.inputs.slug }}"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then BEFORE="HEAD~1"; fi
            S=$(git diff --name-only "$BEFORE" "${{ github.sha }}" -- 'projects/d-*/shots.json' | cut -d/ -f2 | sort -u | tr '\n' ' ')
          fi
          echo "slugs=$S" >> "$GITHUB_OUTPUT"
          echo "จะทำ: $S"
          if [ -z "$OPENROUTER_API_KEY" ]; then echo "::error::ยังไม่ได้ตั้ง secret OPENROUTER_API_KEY (Settings → Secrets and variables → Actions)"; exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ติดตั้งเครื่องมือ
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg zip fonts-thai-tlwg \
            libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev \
            libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2
          python3 -m pip install -q pillow
          npm ci --no-audit --no-fund
          npx remotion browser ensure

      - name: สร้างคลิป
        run: |
          set -o pipefail
          for S in ${{ steps.slugs.outputs.slugs }}; do
            echo "::group::$S — ตรวจ"
            node scripts/validate.mjs "projects/$S"
            echo "::endgroup::"

            echo "::group::$S — ภาพ AI"
            if [ -f "projects/$S/images.json" ]; then
              python3 scripts/imagegen.py "$S" --variants 1 --max-cost "$IMAGE_MAX_COST" || echo "::warning::$S สร้างภาพ AI ไม่ครบ — ใช้ vector สำรอง"
              node scripts/auto/autoselect.mjs "$S" || true
              python3 scripts/auto/fix-cutouts.py "$S" || echo "::warning::$S ลบพื้นหลังรูป cutout ไม่สำเร็จ"
            fi
            echo "::endgroup::"

            echo "::group::$S — เสียงพากย์"
            python3 scripts/tts.py "projects/$S/shots.json"
            echo "::endgroup::"

            echo "::group::$S — เรนเดอร์"
            node scripts/render.mjs "$S"
            node scripts/cover.mjs "$S" || echo "::warning::$S ทำปกไม่สำเร็จ"
            node scripts/post.mjs "$S" || echo "::warning::$S post.json มีจุดต้องแก้"
            node scripts/auto/package.mjs "$S"
            echo "::endgroup::"

            TITLE=$(node -e "const m=require('./out/package/$S/meta.json');console.log((m.title||'$S')+' · โพสต์ '+(m.postAt||''))")
            if gh release view "$S" >/dev/null 2>&1; then
              gh release upload "$S" "out/package/$S.zip" --clobber
            else
              gh release create "$S" "out/package/$S.zip" --title "$TITLE" --notes-file "out/package/$S/README.txt" --target "${{ github.sha }}"
            fi
            echo "### ✓ $S — $TITLE" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: เก็บไฟล์ไว้ดูกรณีพัง
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-${{ github.run_id }}
          path: |
            out/package/
            out/cover/
          retention-days: 7
          if-no-files-found: ignore
